# rglat5340: Dell Latitude 5340, AX211 CNVi (8086:51f1), i5-1345U.
# NetworkManager plus wpa_supplicant. Do not stop NetworkManager for egress.
# wifi.powersave is a NetworkManager key. Kernel default stays BBR + fq.
# tcp_notsent_lowat keeps SSH and VPN from filling the Wi-Fi queue.
net.ipv4.tcp_notsent_lowat = 131072
net.ipv4.tcp_slow_start_after_idle = 0
net.core.netdev_budget = 300
net.core.netdev_budget_usecs = 2000
