# linux-rg seat drop-in for grokos-sessiond.service
# Installed at /usr/lib/systemd/user/grokos-sessiond.service.d/linux-rg.conf
# Applies when the sessiond user unit exists. Agents are sibling
# grokos-{32hex}.scope units; do not put panes in this service cgroup.
[Service]
Delegate=yes
CPUAccounting=yes
MemoryAccounting=yes
IOAccounting=yes
MemoryPressureWatch=on
ManagedOOMPreference=omit
Environment=GROKOS_JAIL=auto
