# rgam5terra: RTL8125 on r8169, rtw89 Wi-Fi, 16 cores / 32 threads.
# Not an iwlwifi host. No laptop tcp_notsent_lowat: the LAN RTT is short.
# Kernel default stays BBR + fq. RPS masks stay out of this file.
net.ipv4.tcp_slow_start_after_idle = 0
net.core.netdev_budget = 600
net.core.netdev_budget_usecs = 4000
net.core.netdev_max_backlog = 2000
