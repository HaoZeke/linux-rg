# GrokOS + CRIU workflow floors shipped with linux-rg.
# Installed as /usr/lib/sysctl.d/50-linux-rg-grokos.conf.
# Per-machine /etc/sysctl.d keeps swappiness, dirty, and watermark.

# Cgroup slices (sessiond job leaves) own fairness. Autogroup tty
# groups hide cpu.weight from those leaves.
kernel.sched_autogroup_enabled = 0

# Large agent address space plus CRIU VMA dump. Same floor as Arch
# 10-arch.conf so a non-Arch root still gets it.
vm.max_map_count = 1048576

# spawnAgent, bwrap pid ns, CRIU restore of high pids. Same floor as
# systemd 50-pid-max.conf.
kernel.pid_max = 4194304

# Workspace and editor watches. Same floor as Arch 10-arch.conf.
fs.inotify.max_user_instances = 1024
fs.inotify.max_user_watches = 524288

# Cap'n AF_UNIX burst headroom.
net.unix.max_dgram_qlen = 512

# Restored or runaway RT helper cannot pin a CPU.
kernel.sched_rt_runtime_us = 950000

# These seats are one memory controller (U-series; Zen 5 NPS1).
# AutoNUMA page-scan has no slow node and burns cycles (IISWC 2022).
vm.numa_balancing = 0

# CRIU dump of a same-uid agent uses CAP_CHECKPOINT_RESTORE or parent
# ptrace. Do not lower kernel.yama.ptrace_scope. Do not set
# vm.unprivileged_userfaultfd=1.
