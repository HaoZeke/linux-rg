name: ci

on:
  push:
  pull_request:
  schedule:
    # Mondays 11:17 UTC, after Arch's usual weekend tags.
    - cron: '17 11 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck ripgrep
      - name: Shell syntax and shellcheck errors
        run: |
          mapfile -t files < <(git ls-files | while read -r f; do
            [ -f "$f" ] && head -n1 "$f" | grep -qE '^#!.*\b(ba)?sh\b' && echo "$f"; done)
          for f in "${files[@]}"; do bash -n "$f"; done
          shellcheck -S error "${files[@]}"
      - name: Python syntax
        run: |
          for f in $(git ls-files '*.py'); do python3 -m py_compile "$f"; done
      - name: .SRCINFO matches PKGBUILD
        run: scripts/linux-rg-srcinfo-check

  selftests:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep libarchive-tools zstd
      - uses: cargo-bins/cargo-binstall@main
      - name: Install rtrash
        run: cargo binstall --no-confirm rtrash || cargo install --locked rtrash
      - name: Selftests
        run: scripts/linux-rg-ci-selftests

  replay:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Source key
        id: key
        run: echo "pkgver=$(sed -n 's/^\tpkgver = //p' .SRCINFO)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/linux-rg-srcdest
          key: srcdest-${{ steps.key.outputs.pkgver }}
      - name: Install tools
        # dwarves gives pahole for DEBUG_INFO_BTF (and SCHED_CLASS_EXT with
        # it); libclang-dev is what bindgen loads for the Rust probe.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq flex bison libelf-dev libssl-dev dwarves libclang-dev
      - name: Rust toolchain for the kernel's Rust probe
        # Kconfig only offers CONFIG_RUST when scripts/rust_is_available.sh
        # finds rustc, rust-src and bindgen at or above
        # scripts/min-tool-version.sh. Pinned so a new stable cannot move
        # the result under us.
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component rust-src
          rustup default 1.99.0
      - uses: cargo-bins/cargo-binstall@main
      - name: Install bindgen
        run: cargo binstall --no-confirm bindgen-cli@0.71.1 || cargo install --locked bindgen-cli@0.71.1
      - name: Replay carry series on the packaged Arch tag
        run: scripts/linux-rg-ci-replay ~/linux-rg-srcdest ~/replay-work
      - name: Kernel finds Rust and pahole
        run: |
          pahole --version
          make -s -C ~/replay-work/linux-* rustavailable
      - name: Every profile overlay line survives olddefconfig
        run: scripts/linux-rg-overlay-check ~/replay-work/linux-*

  upstream:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Fail when Arch has tagged a newer kernel
        run: scripts/linux-rg-upstream-check
